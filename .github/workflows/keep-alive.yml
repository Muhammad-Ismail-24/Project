name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 14 minutes to beat the 15-minute sleep timer
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab if needed

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health check
        # RENDER_BACKEND_URL secret must be set in:
        # GitHub repo → Settings → Secrets → Actions
        # Value: https://your-backend-name.onrender.com
        run: |
          curl -f -s \
            ${{ secrets.RENDER_BACKEND_URL }}/health \
            -w "\nStatus: %{http_code}" || true
        
      - name: Log Success
        run: echo "Successfully pinged the GaariGuru backend!"